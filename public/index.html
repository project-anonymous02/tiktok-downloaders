<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TikTok Downloader Premium - Download video TikTok tanpa watermark MP3 MP4">
    <meta name="theme-color" content="#0f3b28">
    <title>TikTok Downloader Premium by nata~</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== VARIABLES TEMA HITAM + WARNA PROMPT ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #1e8b4c;
            --primary-dark: #0f3b28;
            --accent: #25d366;
            --error: #d32f2f;
            --warning: #f97316;
            
            --bg-dark: #0a0f0d;
            --bg-darker: #060908;
            --card-bg: #111815;
            --card-bg-light: #17201c;
            --text-primary: #e8f5ef;
            --text-secondary: #8fa89c;
            --text-tertiary: #5a7b6f;
            --border-color: #1f2e27;
            --border-light: #2a3d34;
            
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 999px;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            overflow-x: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            position: relative;
        }

        /* ===== 1. LOADING SCREEN DENGAN DASHBOARD.JPG ===== */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: rgba(6, 9, 8, 0.98);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s var(--ease-out), visibility 0.4s var(--ease-out);
        }
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* DASHBOARD.JPG ASLI - SESUAI PROMPT 1:1 200PX */
        .dashboard-img {
            width: 200px;
            height: 200px;
            border-radius: var(--radius-lg);
            object-fit: cover;
            box-shadow: 0 16px 48px rgba(30, 139, 76, 0.3);
            animation: float 3s ease-in-out infinite;
            background: linear-gradient(135deg, var(--primary-dark), var(--accent));
        }
        /* ANIMASI PINDAH KE POJOK KIRI ATAS JADI 60PX - SESUAI PROMPT 2.3.1 */
        .dashboard-img.relocate {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 60px !important;
            height: 60px !important;
            border-radius: 50% !important;
            animation: relocate 0.6s var(--spring) forwards !important;
            z-index: 100;
        }
        .spinner-dots {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }
        .spinner-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 1.5s infinite;
        }
        .spinner-dot:nth-child(2) { animation-delay: 0.2s; }
        .spinner-dot:nth-child(3) { animation-delay: 0.4s; }
        .loading-text {
            margin-top: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ===== 2. MAIN APP CARD ===== */
        .app-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg-light) 100%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-light);
            padding: 40px 32px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.5s var(--spring);
            position: relative;
        }
        .app-container.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .app-container:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 24px 80px rgba(30, 139, 76, 0.25);
        }
        .app-container::-webkit-scrollbar { width: 6px; }
        .app-container::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

        /* ===== 3. HEADER PROFILE SECTION ===== */
        .header-section {
            text-align: center;
            margin-bottom: 32px;
            animation: slideUp 0.6s var(--spring) 0.2s backwards;
        }
        .app-title {
            font-size: 32px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-tagline {
            font-size: 15px;
            color: var(--accent);
            margin-bottom: 20px;
            font-weight: 500;
        }
        .pill-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .pill {
            background: rgba(30, 139, 76, 0.15);
            border: 1px solid var(--primary);
            padding: 8px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            transition: all 0.25s var(--spring);
        }
        .pill:hover {
            transform: scale(1.05);
            background: rgba(37, 211, 102, 0.2);
        }

        /* ===== 4. INPUT SECTION ===== */
        .input-section {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            animation: slideUp 0.6s var(--spring) 0.3s backwards;
        }
        .input-wrapper {
            flex: 1;
            min-width: 200px;
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            transition: all 0.2s var(--spring);
        }
        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 139, 76, 0.15);
        }
        .input-wrapper.error {
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(211, 47, 47, 0.15);
        }
        .input-wrapper i {
            color: var(--primary);
            margin-right: 10px;
            font-size: 16px;
        }
        .url-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
        }
        .url-input::placeholder { color: var(--text-tertiary); }
        .url-input:disabled { opacity: 0.6; }
        .btn-fetch {
            padding: 14px 22px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #fff;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s var(--spring);
            white-space: nowrap;
        }
        .btn-fetch:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(30, 139, 76, 0.35);
        }
        .btn-fetch:active:not(:disabled) { transform: scale(0.98); }
        .btn-fetch:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ===== 5. FORMAT TOGGLE SEGMENTED IOS ===== */
        .format-section {
            margin-bottom: 20px;
            animation: slideUp 0.6s var(--spring) 0.4s backwards;
        }
        .format-toggle {
            display: flex;
            gap: 12px;
        }
        .format-btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 2px solid var(--primary);
            background: transparent;
            color: var(--accent);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .format-btn.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 6px 18px rgba(30, 139, 76, 0.35);
        }
        .format-btn:hover:not(.active) {
            background: rgba(30, 139, 76, 0.1);
            border-color: var(--accent);
        }

        /* ===== 6. PREVIEW SECTION ===== */
        .preview-section {
            display: none;
            margin: 20px 0;
            padding: 16px;
            background: rgba(30, 139, 76, 0.05);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            animation: slideUp 0.4s var(--spring);
        }
        .preview-section.show { display: block; }
        .thumb-wrapper {
            position: relative;
            width: 100%;
            max-height: 320px;
            aspect-ratio: 16/9;
            border-radius: var(--radius-md);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .preview-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 59, 40, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .play-overlay:hover { opacity: 1; }
        .play-overlay i {
            font-size: 48px;
            color: rgba(255,255,255,0.8);
        }
        .preview-caption {
            margin-top: 12px;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
        }
        .preview-meta {
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* ===== 7. CUSTOM FILENAME INPUT ===== */
        .filename-section {
            display: none;
            margin: 16px 0;
            animation: slideUp 0.4s var(--spring) 0.1s backwards;
        }
        .filename-section.show { display: block; }
        .filename-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filename-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filename-input {
            flex: 1;
            padding: 12px 14px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .filename-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 139, 76, 0.15);
        }
        .filename-input::placeholder { color: var(--text-tertiary); }
        .filename-ext {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            padding: 0 8px;
        }
        .filename-status {
            width: 36px;
            text-align: center;
            font-size: 16px;
        }
        .filename-status.valid { color: var(--accent); }
        .filename-status.invalid { color: var(--error); }
        .filename-helper {
            margin-top: 4px;
            font-size: 12px;
            display: none;
        }
        .filename-helper.show { display: block; }
        .filename-helper.error { color: var(--error); }

        /* ===== 8. DOWNLOAD BUTTON + LOADING.MP4 PROGRESS ===== */
        .download-section {
            margin-top: 8px;
            animation: slideUp 0.6s var(--spring) 0.5s backwards;
        }
        .btn-download {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s var(--spring);
            height: 56px;
            overflow: hidden;
        }
        .btn-download:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(30, 139, 76, 0.4);
        }
        .btn-download:active:not(:disabled) { transform: scale(0.98); }
        .btn-download:disabled { opacity: 0.6; cursor: not-allowed; }

        /* PROGRESS CONTAINER DENGAN LOADING.MP4 ASLI */
        .progress-container {
            display: none;
            position: relative;
            width: 100%;
            height: 220px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: #000;
            animation: slideUp 0.4s var(--spring);
        }
        .progress-container.show { display: block; }
        /* LOADING.MP4 ASLI - SESUAI PERMINTAAN */
        .loading-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .progress-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 59, 40, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .progress-text-top {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(15, 59, 40, 0.85);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }
        .progress-percent {
            font-size: 48px;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .progress-label {
            font-size: 14px;
            color: rgba(255,255,255,0.9);
        }
        .progress-bar-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.25);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.2s linear;
        }
        .btn-cancel {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.5);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn-cancel:hover { background: rgba(0,0,0,0.7); }

        /* ===== 9. TOAST NOTIFICATION ===== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: var(--card-bg);
            border-left: 4px solid var(--primary);
            padding: 16px;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            animation: slideDown 0.3s var(--spring);
            pointer-events: auto;
            border: 1px solid var(--border-light);
        }
        .toast.success { border-left-color: var(--accent); }
        .toast.success i { color: var(--accent); }
        .toast.error { border-left-color: var(--error); }
        .toast.error i { color: var(--error); }
        .toast.warning { border-left-color: var(--warning); }
        .toast.warning i { color: var(--warning); }
        .toast i { font-size: 18px; flex-shrink: 0; }

        /* ===== 10. FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-tertiary);
            animation: slideUp 0.6s var(--spring) 0.6s backwards;
        }
        .footer a { color: var(--accent); text-decoration: none; }

        /* ===== 11. KEYFRAMES ANIMASI SESUAI PROMPT ===== */
        @keyframes pulse {
            0%,100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes relocate {
            0% { transform: translate(0,0) scale(1); border-radius: var(--radius-lg); }
            100% { transform: translate(0,0) scale(1); border-radius: 50%; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* ===== 12. RESPONSIF MOBILE ===== */
        @media (max-width: 640px) {
            .app-container { padding: 32px 18px 24px; }
            .app-title { font-size: 26px; }
            .btn-fetch { width: 100%; justify-content: center; }
            .format-toggle { flex-direction: column; }
            .dashboard-img.relocate { width: 48px !important; height: 48px !important; top: 12px; left: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- LOADING SCREEN DENGAN DASHBOARD.JPG -->
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
        <img id="dashboardImg" class="dashboard-img" src="dashboard.jpg" alt="Loading aplikasi" onerror="this.style.background='linear-gradient(135deg,#0f3b28,#25d366)'">
        <div class="spinner-dots" aria-hidden="true">
            <div class="spinner-dot"></div>

    </div>

    <!-- MAIN APP -->
    <div class="app-container" id="appContainer">
        <!-- HEADER -->
        <div class="header-section">

            <div class="pill-badges">
                <div class="pill"><i class="fas fa-bolt"></i> FAST</div>
                <div class="pill"><i class="fas fa-shield-alt"></i> SECURE</div>

        <!-- INPUT URL -->

                <input type="text" class="filename-input" id="filenameInput" placeholder="Biarkan kosong untuk nama otomatis" maxlength="50">

                <i class="fas fa-download"></i>

        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2025 nata~ ❤️ • All rights reserved • 
            <a href="#" onclick="return false;">Privacy</a> • <a href="#" onclick="return false;">Terms</a>
        </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ===== 1. KONFIGURASI & API (DIPERTAHANKAN SESUAI PROMPT 1.1) =====
        const CONFIG = {
            LOADING_DURATION: 6000,
            API_TIMEOUT_SINGLE: 5000,
            API_TIMEOUT_OVERALL: 6000,
            INPUT_DEBOUNCE: 300,
            TOAST_DURATION: 3000,
            MAX_FILENAME_LENGTH: 50
        };
        const API_ENDPOINTS = [
            url => `https://tikwm.com/api/?url=${encodeURIComponent(url)}`,
            url => `https://api.tikwm.com/video/info?url=${encodeURIComponent(url)}`
        ];
        const STATE = {
            videoData: null,
            currentFormat: 'mp4',
            isLoading: false,
            isDownloading: false,
            currentFilename: '',
            currentXHR: null
        };

        // ===== 2. CACHE DOM =====
        const DOM = {
            loadingScreen: document.getElementById('loadingScreen'),
            dashboardImg: document.getElementById('dashboardImg'),
            appContainer: document.getElementById('appContainer'),
            urlInput: document.getElementById('urlInput'),
            inputWrapper: document.getElementById('inputWrapper'),
            processBtn: document.getElementById('processBtn'),
            formatBtns: document.querySelectorAll('.format-btn'),
            previewSection: document.getElementById('previewSection'),
            previewThumb: document.getElementById('previewThumb'),
            previewCaption: document.getElementById('previewCaption'),
            previewMeta: document.getElementById('previewMeta'),
            filenameSection: document.getElementById('filenameSection'),
            filenameInput: document.getElementById('filenameInput'),
            filenameExt: document.getElementById('filenameExt'),
            filenameStatus: document.getElementById('filenameStatus'),
            filenameHelper: document.getElementById('filenameHelper'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadText: document.getElementById('downloadText'),
            progressContainer: document.getElementById('progressContainer'),
            loadingVideo: document.getElementById('loadingVideo'),
            progressPercent: document.getElementById('progressPercent'),
            progressBar: document.getElementById('progressBar'),
            progressTextTop: document.getElementById('progressTextTop'),
            btnCancel: document.getElementById('btnCancel'),
            toastContainer: document.getElementById('toastContainer')
        };

        // ===== 3. FUNGSI UTILITY =====
        function formatNumber(n){
            if(!n) return '0';
            if(n>=1e6) return (n/1e6).toFixed(1)+'M';
            if(n>=1e3) return (n/1e3).toFixed(1)+'K';
            return n.toString();
        }
        function formatDuration(s){
            if(!s) return '0:00';
            const m=Math.floor(s/60), sec=s%60;
            return `${m}:${sec.toString().padStart(2,'0')}`;
        }
        function debounce(f,d){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),d);};}
        function truncateText(t,m=100){return t.length>m?t.slice(0,m)+'...':t;}
        function sanitizeFilename(i){return i.replace(/[<>:"/\\|?*]/g,'').slice(0,CONFIG.MAX_FILENAME_LENGTH).trim();}

        function validateURL(u){
            const ok = u.toLowerCase().includes('tiktok');
            DOM.inputWrapper.classList.toggle('error', !ok && u.length>0);
            return ok;
        }
        function validateFilename(v){
            DOM.filenameStatus.classList.remove('valid','invalid');
            DOM.filenameHelper.classList.remove('show','error');
            if(!v.length) return true;
            const s = sanitizeFilename(v);
            if(!s.length || v.length>CONFIG.MAX_FILENAME_LENGTH){
                DOM.filenameStatus.classList.add('invalid');
                DOM.filenameStatus.innerHTML = '<i class="fas fa-times"></i>';
                DOM.filenameHelper.classList.add('show','error');
                DOM.filenameHelper.textContent = 'Nama tidak valid / terlalu panjang';
                return false;
            }
            DOM.filenameStatus.classList.add('valid');
            DOM.filenameStatus.innerHTML = '<i class="fas fa-check"></i>';
            return true;
        }

        function showToast(msg, type='info', dur=CONFIG.TOAST_DURATION){
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            const ic = type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':type==='warning'?'fa-triangle-exclamation':'fa-info-circle';
            t.innerHTML = `<i class="fas ${ic}"></i><span>${msg}</span>`;
            DOM.toastContainer.appendChild(t);
            setTimeout(()=>{
                t.style.animation = 'slideUp 0.3s ease reverse';
                setTimeout(()=>t.remove(),300);
            }, dur);
        }

        // ===== 4. API INTEGRATION (DIPERTAHANKAN PENUH) =====
        async function tryAPI(url){
            try{
                const c = new AbortController();
                const tm = setTimeout(()=>c.abort(), CONFIG.API_TIMEOUT_SINGLE);
                const r = await fetch(url, {signal:c.signal, headers:{'Accept':'application/json'}});
                clearTimeout(tm);
                if(!r.ok) return null;
                const j = await r.json();
                if(j?.data?.play || j?.data?.music?.play) return j.data;
                return null;
            }catch(e){ return null; }
        }
        async function fetchFromAPIs(url){
            try{
                const tmOut = new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')), CONFIG.API_TIMEOUT_OVERALL));
                const res = await Promise.race([Promise.all(API_ENDPOINTS.map(fn=>tryAPI(fn(url)))), tmOut]);
                const data = res.find(x=>x!==null);
                if(!data) throw new Error('empty');
                return data;
            }catch(e){ throw e; }
        }

        // ===== 5. PROSES URL & PREVIEW =====
        async function processURL(){
            const url = DOM.urlInput.value.trim();
            if(!validateURL(url)){ showToast('Link TikTok tidak valid','error'); return; }
            if(STATE.isLoading) return;
            STATE.isLoading = true;
            DOM.processBtn.disabled = true;
            DOM.urlInput.disabled = true;
            try{
                showToast('Sedang mengambil data video...','info');
                const data = await fetchFromAPIs(url);
                STATE.videoData = data;
                const vid = data.id || Date.now();
                STATE.currentFilename = `tiktok_${vid}_${STATE.currentFormat}`;
                DOM.filenameInput.value = '';
                showPreview(data);
                showToast('Video berhasil dimuat!','success');
            }catch(e){
                let m = 'Terjadi kesalahan, coba lagi';
                if(e.message==='timeout') m='Koneksi lambat, silakan coba lagi';
                else if(e.message==='empty') m='Video tidak dapat diakses (mungkin terhapus)';
                showToast(m,'error',4000);
            }finally{
                STATE.isLoading = false;
                DOM.processBtn.disabled = false;
                DOM.urlInput.disabled = false;
            }
        }

        function showPreview(d){
            const cover = d.cover || d.ai_dynamic_cover || d.origin_cover;
            if(cover) DOM.previewThumb.src = cover;
            DOM.previewCaption.textContent = truncateText(d.title || 'Tanpa judul');
            DOM.previewMeta.innerHTML = `
                <i class="fas fa-heart"></i> ${formatNumber(d.digg_count)} • 
                <i class="fas fa-clock"></i> ${formatDuration(d.duration)} • 
                <i class="fas fa-eye"></i> ${formatNumber(d.play_count)} • 
                <i class="fas fa-comment"></i> ${formatNumber(d.comment_count)}
            `;
            DOM.previewSection.classList.add('show');
            DOM.filenameSection.classList.add('show');
        }

        // ===== 6. UPDATE UI =====
        function updateFormatUI(){
            DOM.downloadText.textContent = `DOWNLOAD ${STATE.currentFormat.toUpperCase()}`;
            DOM.filenameExt.textContent = `.${STATE.currentFormat}`;
        }
        function getDownloadURL(){
            if(!STATE.videoData) return null;
            return STATE.currentFormat==='mp4'
                ? (STATE.videoData.hdplay || STATE.videoData.play)
                : STATE.videoData.music?.play;
        }
        function getFinalFilename(){
            let n = DOM.filenameInput.value.trim();
            if(!n) n = STATE.currentFilename;
            return `${sanitizeFilename(n)}.${STATE.currentFormat}`;
        }
        function triggerDownload(blob, name){
            const u = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = u; a.download = name;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a);
            setTimeout(()=>URL.revokeObjectURL(u),1000);
        }

        // ===== 7. DOWNLOAD DENGAN LOADING.MP4 =====
        async function startDownload(){
            const url = getDownloadURL();
            const fname = getFinalFilename();
            if(!url){ showToast('Link download tidak ditemukan','error'); return; }
            if(!validateFilename(DOM.filenameInput.value)){ showToast('Nama file tidak valid','error'); return; }
            
            STATE.isDownloading = true;
            // TAMPILKAN LOADING.MP4 + SEMBUNYIKAN TOMBOL
            DOM.downloadBtn.style.display = 'none';
            DOM.progressContainer.classList.add('show');
            // PASTIKAN LOADING.MP4 DIPUTAR
            try{ DOM.loadingVideo.currentTime = 0; DOM.loadingVideo.play(); }catch(e){}

            try{
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob';
                xhr.onprogress = e => {
                    if(e.lengthComputable){
                        const p = Math.round((e.loaded/e.total)*100);
                        DOM.progressBar.style.width = p+'%';
                        DOM.progressPercent.textContent = p+'%';
                        DOM.progressTextTop.textContent = `${p}% • Mengunduh...`;
                    }
                };
                xhr.onload = () => {
                    if(xhr.status===200){
                        triggerDownload(xhr.response, fname);
                        showToast('✓ Download selesai!','success');
                    }else{
                        showToast(`Gagal: HTTP ${xhr.status}`,'error');
                    }
                    resetDownloadUI();
                };
                xhr.onerror = () => { showToast('Error jaringan saat download','error'); resetDownloadUI(); };
                xhr.onabort = () => { showToast('Download dibatalkan','warning'); resetDownloadUI(); };
                xhr.send();
                STATE.currentXHR = xhr;
            }catch(e){
                showToast('Gagal memulai download','error');
                resetDownloadUI();
            }
        }

        function resetDownloadUI(){
            STATE.isDownloading = false;
            STATE.currentXHR = null;
            try{ DOM.loadingVideo.pause(); }catch(e){}
            DOM.progressContainer.classList.remove('show');
            DOM.downloadBtn.style.display = 'flex';
            DOM.progressBar.style.width = '0%';
            DOM.progressPercent.textContent = '0%';
            DOM.progressTextTop.textContent = '0% • Memulai...';
        }
        function cancelDownload(){
            if(STATE.currentXHR) STATE.currentXHR.abort();
        }

        // ===== 8. INISIALISASI LOADING 6 DETIK + ANIMASI RELOCATE =====
        function initApp(){
            setTimeout(()=>{
                // LANGKAH 1: SEMBUNYIKAN LOADING SCREEN
                DOM.loadingScreen.classList.add('hidden');
                // LANGKAH 2: JALANKAN ANIMASI DASHBOARD.JPG PINDAH KE POJOK
                setTimeout(()=>{
                    DOM.dashboardImg.classList.add('relocate');
                    // LANGKAH 3: TAMPILKAN APP CARD
                    setTimeout(()=>{
                        DOM.appContainer.classList.add('visible');
                        DOM.urlInput.focus();
                    }, 200);
                }, 200);
            }, CONFIG.LOADING_DURATION);
        }

        // ===== 9. EVENT LISTENERS =====
        function setupEvents(){
            DOM.urlInput.addEventListener('keypress', e=>{ if(e.key==='Enter' && !STATE.isLoading) processURL(); });
            DOM.urlInput.addEventListener('input', debounce(()=>validateURL(DOM.urlInput.value), CONFIG.INPUT_DEBOUNCE));
            DOM.processBtn.addEventListener('click', processURL);
            
            DOM.formatBtns.forEach(b=>{
                b.addEventListener('click', e=>{
                    DOM.formatBtns.forEach(x=>x.classList.remove('active'));
                    const t = e.target.closest('.format-btn');
                    t.classList.add('active');
                    STATE.currentFormat = t.dataset.format;
                    updateFormatUI();
                });
            });

            DOM.filenameInput.addEventListener('input', e=>{
                e.target.value = sanitizeFilename(e.target.value);
                validateFilename(e.target.value);
            });

            DOM.downloadBtn.addEventListener('click', startDownload);
            DOM.btnCancel.addEventListener('click', cancelDownload);
        }

        // JALANKAN SEMUA
        setupEvents();
        initApp();
    </script>
</body>
</html>
