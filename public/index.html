<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="TikTok Downloader Premium - Download video TikTok tanpa watermark MP3 MP4">
    <meta name="theme-color" content="#050505">
    <title>TikTok Downloader Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #1ed760;
            --primary-soft: rgba(30, 215, 96, 0.18);
            --error: #ef4444;
            --warning: #f59e0b;
            --bg-0: #000000;
            --bg-1: #070c09;
            --bg-2: #0d1410;
            --glass: rgba(22, 28, 24, 0.72);
            --glass-strong: rgba(28, 36, 31, 0.88);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.14);
            --text: #f5f7f6;
            --text-2: #aab5ae;
            --text-3: #6b7871;
            --r-xs: 8px; --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 28px; --r-full: 9999px;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --soft: cubic-bezier(0.4, 0, 0.2, 1);
            --safe-t: max(0px, env(safe-area-inset-top));
            --safe-b: max(0px, env(safe-area-inset-bottom));
        }
        html, body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 700px at 50% -10%, rgba(30,215,96,0.10), transparent 60%),
                linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 50%, var(--bg-2) 100%);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body { padding: calc(16px + var(--safe-t)) 14px calc(20px + var(--safe-b)); }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input { font-family: inherit; color: inherit; }
        img, video { display: block; max-width: 100%; }
        .media-lock {
            pointer-events: none !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -webkit-user-drag: none !important;
        }
        .media-lock::-webkit-media-controls { display: none !important; appearance: none; }

        /* ========== LOADING SCREEN ========== */
        .loading-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px;
            transition: opacity 0.7s var(--ease), visibility 0.7s var(--ease);
        }
        .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .loading-dashboard {
            width: min(210px, 52vw);
            aspect-ratio: 1 / 1;
            border-radius: var(--r-lg);
            object-fit: cover;
            box-shadow: 0 24px 70px rgba(30,215,96,0.18), 0 10px 30px rgba(0,0,0,0.6);
            animation: floaty 3.6s ease-in-out infinite;
            background: linear-gradient(135deg, #0f3b28, #1ed760);
            margin-bottom: 26px;
            will-change: transform, opacity;
        }
        .loading-brand {
            font-size: clamp(22px, 5.2vw, 28px);
            font-weight: 700;
            letter-spacing: -0.4px;
            margin-bottom: 34px;
            text-align: center;
            transition: opacity 0.4s var(--ease);
        }
        .loading-dots { display: flex; gap: 10px; transition: opacity 0.4s var(--ease); }
        .loading-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--primary); opacity: 0.25;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .loading-dot:nth-child(2){ animation-delay: 0.18s; }
        .loading-dot:nth-child(3){ animation-delay: 0.36s; }
        @keyframes floaty {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes dotPulse {
            0%,100% { opacity: 0.25; transform: scale(0.82); }
            50% { opacity: 1; transform: scale(1.12); }
        }

        /* ========== LOGO HERO (TUJUAN ANIMASI DASHBOARD.JPG) ========== */
        .logo-hero {
            width: clamp(56px, 14vw, 68px);
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 14px;
            box-shadow: 0 12px 32px rgba(30,215,96,0.25), 0 0 0 1px rgba(255,255,255,0.08);
            background: linear-gradient(135deg, #0f3b28, #1ed760);
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.01s;
        }
        .logo-hero.ready {
            transition: all 0.9s var(--spring);
            opacity: 1 !important;
            transform: scale(1) !important;
        }
        /* FLIP animasi: elemen terbang dari tengah ke logo */
        .flying-logo {
            position: fixed !important;
            z-index: 10000 !important;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            object-fit: cover;
            box-shadow: 0 24px 70px rgba(30,215,96,0.25);
            will-change: transform, border-radius;
            pointer-events: none;
            transition:
                transform 0.95s var(--spring),
                border-radius 0.95s var(--spring),
                box-shadow 0.95s var(--ease),
                opacity 0.5s var(--ease) 0.8s;
        }

        /* ========== APP ========== */
        .app {
            max-width: 520px;
            margin: 0 auto;
            opacity: 0;
            transform: translateY(26px) scale(0.97);
            transition: opacity 0.8s var(--spring), transform 0.8s var(--spring);
        }
        .app.show { opacity: 1; transform: none; }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }
        .header > * { opacity: 0; transform: translateY(12px); transition: all 0.6s var(--spring); }
        .app.show .header > *:nth-child(1) { transition-delay: 0.15s; opacity: 1; transform: none; }
        .app.show .header > *:nth-child(2) { transition-delay: 0.25s; opacity: 1; transform: none; }
        .app.show .header > *:nth-child(3) { transition-delay: 0.35s; opacity: 1; transform: none; }
        .app.show .header > *:nth-child(4) { transition-delay: 0.45s; opacity: 1; transform: none; }

        .title {
            font-size: clamp(26px, 7vw, 34px);
            font-weight: 800;
            letter-spacing: -0.9px;
            line-height: 1.05;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            margin-bottom: 6px;
        }
        .subtitle {
            font-size: 13.5px;
            color: var(--text-2);
            margin-bottom: 16px;
        }
        .badges {
            display: flex; flex-wrap: wrap; gap: 7px;
            justify-content: center;
        }
        .badge {
            padding: 5px 11px;
            border-radius: var(--r-full);
            font-size: 11px; font-weight: 600;
            background: var(--primary-soft);
            color: var(--primary);
            border: 1px solid rgba(30,215,96,0.25);
            letter-spacing: 0.2px;
            transition: all 0.3s var(--spring);
        }
        .badge:hover { transform: translateY(-1px) scale(1.04); box-shadow: 0 6px 14px rgba(30,215,96,0.2); }

        /* ========== MAIN MP4 BANNER ========== */
        .banner {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: var(--r-xl);
            overflow: hidden;
            margin-bottom: 18px;
            background: linear-gradient(135deg, #0a1f12, #143020);
            box-shadow: 0 14px 40px rgba(0,0,0,0.5), inset 0 0 0 1px var(--border);
            position: relative;
            opacity: 0;
            transform: translateY(14px) scale(0.98);
            transition: all 0.7s var(--spring);
        }
        .app.show .banner { transition-delay: 0.55s; opacity: 1; transform: none; }
        .banner video {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s var(--soft);
        }
        .banner:hover video { transform: scale(1.02); }
        .banner-fallback {
            position: absolute; inset: 0;
            display: none; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.35);
            font-size: 13px;
            padding: 20px; text-align: center;
        }

        /* ========== CARD ========== */
        .card {
            background: var(--glass);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            padding: clamp(16px, 4.2vw, 20px);
            margin-bottom: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            opacity: 0;
            transform: translateY(14px) scale(0.98);
            transition: all 0.7s var(--spring), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
        }
        .app.show .card:nth-of-type(1) { transition-delay: 0.65s; opacity: 1; transform: none; }
        .app.show .card:nth-of-type(2) { transition-delay: 0.78s; opacity: 1; transform: none; }
        .card:hover {
            border-color: rgba(30,215,96,0.25);
            box-shadow: 0 16px 44px rgba(0,0,0,0.45);
        }

        /* ========== INPUT ========== */
        .input-row { display: flex; flex-direction: column; gap: 12px; }
        .input-wrapper {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid transparent;
            border-radius: var(--r-lg);
            padding: 14px 16px;
            min-height: 52px;
            transition: all 0.3s var(--spring);
        }
        .input-wrapper:focus-within {
            border-color: var(--primary);
            background: rgba(30,215,96,0.05);
            box-shadow: 0 0 0 5px rgba(30,215,96,0.12);
            transform: translateY(-1px);
        }
        .input-wrapper.error {
            border-color: var(--error);
            box-shadow: 0 0 0 5px rgba(239,68,68,0.12);
            animation: shake 0.45s var(--ease);
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(3px); }
        }
        .input-wrapper i {
            color: var(--primary); font-size: 16px; flex-shrink: 0;
            transition: transform 0.3s var(--spring);
        }
        .input-wrapper:focus-within i { transform: scale(1.15) rotate(-6deg); }
        .url-input {
            flex: 1;
            background: transparent; border: none; outline: none;
            font-size: 15px; color: var(--text);
            min-width: 0;
        }
        .url-input::placeholder { color: var(--text-3); transition: opacity 0.2s; }
        .url-input:focus::placeholder { opacity: 0.4; }
        .url-input:disabled { opacity: 0.5; }

        .btn-primary {
            min-height: 52px;
            padding: 0 22px;
            border-radius: var(--r-lg);
            background: linear-gradient(135deg, #17a84a, #1ed760);
            color: #06120a;
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s var(--spring);
            box-shadow: 0 8px 24px rgba(30,215,96,0.25);
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.7s var(--ease);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 14px 34px rgba(30,215,96,0.4);
        }
        .btn-primary:hover:not(:disabled)::after { transform: translateX(100%); }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.2); }

        /* ========== SEGMENTED CONTROL iOS ========== */
        .segmented {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--r-lg);
            padding: 5px;
            min-height: 48px;
            margin-top: 14px;
        }
        .seg-indicator {
            position: absolute;
            top: 5px; bottom: 5px; left: 5px;
            width: calc(50% - 5px);
            background: var(--glass-strong);
            border: 1px solid var(--border-strong);
            border-radius: calc(var(--r-lg) - 4px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            transition: transform 0.55s var(--spring);
            z-index: 1;
        }
        .seg-indicator.right { transform: translateX(100%); }
        .seg-btn {
            position: relative; z-index: 2;
            min-height: 44px;
            border-radius: calc(var(--r-lg) - 6px);
            font-size: 14px; font-weight: 600;
            color: var(--text-2);
            display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: color 0.35s var(--ease), transform 0.25s var(--spring);
        }
        .seg-btn.active { color: var(--text); }
        .seg-btn:active:not(.active) { transform: scale(0.97); }
        .seg-btn i { font-size: 13px; transition: transform 0.3s var(--spring); }
        .seg-btn.active i { transform: scale(1.15); }

        /* ========== PREVIEW ========== */
        .preview {
            display: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s var(--spring);
        }
        .preview.show { display: block; opacity: 1; transform: none; }
        .thumb {
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: var(--r-lg);
            overflow: hidden;
            background: linear-gradient(135deg, #0a1f12, #143020);
            margin-bottom: 12px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.45);
            transition: transform 0.4s var(--soft), box-shadow 0.4s var(--soft);
        }
        .thumb:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(0,0,0,0.55); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s var(--soft); }
        .thumb:hover img { transform: scale(1.04); }
        .caption {
            font-size: 14px; font-weight: 600;
            line-height: 1.45;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .meta {
            display: flex; flex-wrap: wrap; gap: 12px;
            font-size: 12.5px; color: var(--text-2);
        }
        .meta span {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 8px;
            background: rgba(255,255,255,0.04);
            border-radius: var(--r-full);
            transition: all 0.25s var(--ease);
        }
        .meta span:hover { background: rgba(30,215,96,0.1); color: var(--text); }
        .meta i { color: var(--primary); font-size: 11px; }

        /* ========== FILENAME ========== */
        .filename {
            display: none;
            margin-top: 14px;
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.45s var(--spring);
        }
        .filename.show { display: block; opacity: 1; transform: none; }
        .filename label {
            display: block;
            font-size: 11px; font-weight: 600;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }
        .filename-row {
            display: flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.04);
            border: 1.5px solid transparent;
            border-radius: var(--r-md);
            padding: 11px 14px;
            min-height: 46px;
            transition: all 0.3s var(--spring);
        }
        .filename-row:focus-within {
            border-color: rgba(30,215,96,0.5);
            background: rgba(30,215,96,0.04);
            box-shadow: 0 0 0 4px rgba(30,215,96,0.1);
        }
        .filename-input {
            flex: 1;
            background: transparent; border: none; outline: none;
            font-size: 14px;
            min-width: 0;
        }
        .filename-input::placeholder { color: var(--text-3); }
        .filename-ext {
            font-size: 12px; color: var(--text-2); font-weight: 600;
            padding: 3px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: var(--r-xs);
            transition: all 0.3s var(--ease);
        }
        .filename-status {
            width: 20px; text-align: center; font-size: 14px;
            opacity: 0; transform: scale(0.6);
            transition: all 0.3s var(--spring);
        }
        .filename-status.ok { opacity: 1; transform: scale(1); color: var(--primary); }
        .filename-status.err { opacity: 1; transform: scale(1); color: var(--error); }

        /* ========== DOWNLOAD / PROGRESS ========== */
        .download-area { margin-top: 16px; }
        .btn-download {
            width: 100%;
            min-height: 56px;
            border-radius: var(--r-lg);
            background: linear-gradient(135deg, #0f3b28, #17a84a);
            color: #fff;
            font-size: 15px; font-weight: 700; letter-spacing: 0.3px;
            display: flex; align-items: center; justify-content: center; gap: 9px;
            transition: all 0.35s var(--spring);
            box-shadow: 0 10px 30px rgba(30,215,96,0.22);
            position: relative;
            overflow: hidden;
        }
        .btn-download::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.25) 50%, transparent 70%);
            transform: translateX(-100%);
            transition: transform 0.9s var(--ease);
        }
        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 16px 42px rgba(30,215,96,0.38);
        }
        .btn-download:hover:not(:disabled)::after { transform: translateX(100%); }
        .btn-download:active:not(:disabled) { transform: scale(0.98); }
        .btn-download:disabled { opacity: 0.55; cursor: not-allowed; filter: grayscale(0.15); }

        .progress-wrap {
            display: none;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 320px;
            border-radius: var(--r-lg);
            overflow: hidden;
            background: #000;
            box-shadow: 0 12px 36px rgba(0,0,0,0.55);
            opacity: 0;
            transform: scale(0.96);
            transition: all 0.45s var(--spring);
        }
        .progress-wrap.show { display: block; opacity: 1; transform: scale(1); }
        .progress-wrap video {
            width: 100%; height: 100%; object-fit: cover;
            opacity: 0.55;
            transition: opacity 0.4s;
        }
        .progress-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(5,10,7,0.35) 0%, rgba(5,10,7,0.82) 100%);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px;
        }
        .btn-cancel {
            position: absolute; top: 14px; left: 14px;
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            color: #fff; font-size: 14px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s var(--spring);
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-cancel:hover {
            background: rgba(239,68,68,0.85);
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 20px rgba(239,68,68,0.4);
        }
        .btn-cancel:active { transform: scale(0.92); }
        .pct-top {
            position: absolute; top: 14px; right: 14px;
            padding: 6px 12px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            border-radius: var(--r-full);
            font-size: 12.5px; font-weight: 700;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 5;
            transition: all 0.2s linear;
        }
        .pct-big {
            font-size: clamp(44px, 13vw, 68px);
            font-weight: 800;
            letter-spacing: -2px;
            color: var(--primary);
            text-shadow: 0 4px 24px rgba(30,215,96,0.45);
            line-height: 1;
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
            transition: transform 0.15s var(--ease);
        }
        .pct-label {
            font-size: 13.5px;
            color: rgba(255,255,255,0.88);
            margin-bottom: 20px;
        }
        .bar-track {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.18);
            overflow: hidden;
        }
        .bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #17a84a, #1ed760);
            transition: width 0.2s linear;
            box-shadow: 0 0 14px rgba(30,215,96,0.7);
            position: relative;
        }
        .bar-fill::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 1.6s linear infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ========== TOAST ========== */
        .toast-wrap {
            position: fixed;
            top: calc(16px + var(--safe-t));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: calc(100% - 28px);
            max-width: 420px;
            display: flex; flex-direction: column; gap: 10px;
            pointer-events: none;
        }
        .toast {
            background: rgba(20,26,22,0.94);
            backdrop-filter: blur(22px);
            border: 1px solid var(--border-strong);
            border-left: 4px solid var(--primary);
            border-radius: var(--r-md);
            padding: 13px 15px;
            box-shadow: 0 12px 34px rgba(0,0,0,0.5);
            display: flex; align-items: flex-start; gap: 11px;
            font-size: 13.5px; line-height: 1.4;
            pointer-events: auto;
            opacity: 0;
            transform: translateY(-18px) scale(0.96);
            animation: toastIn 0.5s var(--spring) forwards;
        }
        .toast.err { border-left-color: var(--error); }
        .toast.warn { border-left-color: var(--warning); }
        .toast i {
            flex-shrink: 0;
            font-size: 16px;
            margin-top: 1px;
            color: var(--primary);
            transition: transform 0.4s var(--spring);
        }
        .toast:hover i { transform: scale(1.2) rotate(-8deg); }
        .toast.err i { color: var(--error); }
        .toast.warn i { color: var(--warning); }
        @keyframes toastIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .toast.out {
            animation: toastOut 0.4s var(--ease) forwards;
        }
        @keyframes toastOut {
            to { opacity: 0; transform: translateY(-12px) scale(0.97); }
        }

        /* ========== FOOTER ========== */
        .footer {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
            font-size: 11.5px;
            color: var(--text-3);
            line-height: 1.6;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.7s var(--spring);
        }
        .app.show .footer { transition-delay: 0.9s; opacity: 1; transform: none; }
        .footer a {
            color: var(--primary);
            text-decoration: none;
            position: relative;
            transition: all 0.25s var(--ease);
        }
        .footer a::after {
            content: '';
            position: absolute; left: 0; right: 0; bottom: -2px;
            height: 1px; background: var(--primary);
            transform: scaleX(0);
            transition: transform 0.3s var(--spring);
        }
        .footer a:hover { color: #fff; }
        .footer a:hover::after { transform: scaleX(1); }

        /* ========== RESPONSIVE ========== */
        @media (min-width: 768px) {
            .input-row { flex-direction: row; align-items: stretch; }
            .input-wrapper { flex: 1; }
            .btn-primary { min-width: 160px; }
        }
        @media (max-width: 380px) {
            .title { font-size: 24px; }
            .pct-big { font-size: 52px; }
        }
        @media (orientation: landscape) and (max-height: 480px) {
            body { padding-top: 10px; padding-bottom: 10px; }
            .banner { max-height: 200px; }
            .progress-wrap { max-height: 200px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

    <!-- ========== LOADING SCREEN ========== -->
    <div class="loading-screen" id="loadingScreen" role="status" aria-live="polite">
        <img
            class="loading-dashboard media-lock"
            id="loadingDashboard"
            src="dashboard.jpg"
            alt="TikTok Downloader"
            draggable="false"
            ondragstart="return false;"
            oncontextmenu="return false;"
            onerror="this.removeAttribute('src');"
        >
        <div class="loading-brand" id="loadingBrand">TikTok Downloader</div>
        <div class="loading-dots" id="loadingDots" aria-hidden="true">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
    </div>

    <!-- ========== MAIN APP ========== -->
    <div class="app" id="app">

        <!-- HEADER DENGAN LOGO TUJUAN -->
        <div class="header">
            <img
                class="logo-hero media-lock"
                id="logoHero"
                src="dashboard.jpg"
                alt="Logo"
                draggable="false"
                ondragstart="return false;"
                oncontextmenu="return false;"
                onerror="this.removeAttribute('src');"
            >
            <h1 class="title">TikTok Downloader</h1>
            <p class="subtitle">Cepat • Bersih • Tanpa Watermark</p>
            <div class="badges">
                <span class="badge"><i class="fas fa-bolt"></i> CEPAT</span>
                <span class="badge"><i class="fas fa-shield-alt"></i> AMAN</span>
                <span class="badge"><i class="fas fa-ban"></i> NO WM</span>
                <span class="badge"><i class="fas fa-music"></i> MP4 / MP3</span>
            </div>
        </div>

        <!-- MAIN MP4 BANNER -->
        <div class="banner">
            <video
                class="media-lock"
                id="mainVideo"
                src="main.mp4"
                autoplay muted loop playsinline
                preload="auto"
                controls="false"
                draggable="false"
                ondragstart="return false;"
                oncontextmenu="return false;"
                webkit-playsinline
            ></video>
            <div class="banner-fallback" id="bannerFallback">
                <i class="fas fa-play-circle" style="font-size:34px;margin-right:10px;color:var(--primary)"></i>
                TikTok Downloader Premium
            </div>
        </div>

        <!-- INPUT CARD -->
        <div class="card">
            <div class="input-row">
                <div class="input-wrapper" id="inputWrapper">
                    <i class="fas fa-link"></i>
                    <input
                        type="text"
                        class="url-input"
                        id="urlInput"
                        placeholder="Paste link TikTok di sini..."
                        aria-label="Link TikTok"
                        autocomplete="off"
                        spellcheck="false"
                    >
                </div>
                <button class="btn-primary" id="fetchBtn" aria-label="Ambil video">
                    <i class="fas fa-bolt"></i> Ambil Video
                </button>
            </div>

            <!-- SEGMENTED -->
            <div class="segmented" role="tablist" aria-label="Pilih format">
                <div class="seg-indicator" id="segIndicator"></div>
                <button class="seg-btn active" data-format="mp4" role="tab" aria-selected="true">
                    <i class="fas fa-film"></i> MP4 VIDEO
                </button>
                <button class="seg-btn" data-format="mp3" role="tab" aria-selected="false">
                    <i class="fas fa-music"></i> MP3 AUDIO
                </button>
            </div>
        </div>

        <!-- PREVIEW + FILENAME + DOWNLOAD -->
        <div class="card">
            <div class="preview" id="preview">
                <div class="thumb">
                    <img id="previewImg" class="media-lock" alt="Preview" draggable="false" ondragstart="return false;" oncontextmenu="return false;">
                </div>
                <div class="caption" id="previewCaption"></div>
                <div class="meta" id="previewMeta"></div>
            </div>

            <div class="filename" id="filenameBox">
                <label for="filenameInput">Nama File</label>
                <div class="filename-row">
                    <input
                        type="text"
                        class="filename-input"
                        id="filenameInput"
                        placeholder="Kosongkan = nama otomatis"
                        maxlength="55"
                        autocomplete="off"
                    >
                    <span class="filename-ext" id="filenameExt">.mp4</span>
                    <span class="filename-status" id="filenameStatus"></span>
                </div>
            </div>

            <div class="download-area">
                <div class="progress-wrap" id="progressWrap">
                    <button class="btn-cancel" id="cancelBtn" aria-label="Batalkan download">
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="pct-top" id="pctTop">0% • Memulai...</div>
                    <video
                        class="media-lock"
                        id="loadingVideo"
                        src="loading.mp4"
                        muted loop playsinline
                        preload="auto"
                        controls="false"
                        draggable="false"
                        ondragstart="return false;"
                        oncontextmenu="return false;"
                        webkit-playsinline
                    ></video>
                    <div class="progress-overlay">
                        <div class="pct-big" id="pctBig">0%</div>
                        <div class="pct-label" id="pctLabel">Sedang mengunduh...</div>
                    </div>
                    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
                </div>

                <button class="btn-download" id="downloadBtn" disabled aria-label="Download">
                    <i class="fas fa-download"></i>
                    <span id="downloadText">DOWNLOAD MP4</span>
                </button>
            </div>
        </div>

        <div class="footer">
            © 2026 TikTok Downloader Premium<br>
            <a href="#" onclick="event.preventDefault()">Privacy</a> • <a href="#" onclick="event.preventDefault()">Terms</a>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-wrap" id="toastWrap"></div>

    <script>
    (function () {
        'use strict';

        // ============================================================
        // 1. KONFIGURASI & STATE
        // ============================================================
        const CONFIG = {
            LOADING_MS: 4200,
            API_TIMEOUT_SINGLE: 6000,
            API_TIMEOUT_TOTAL: 7000,
            INPUT_DEBOUNCE: 250,
            TOAST_MS: 3200,
            MAX_FILENAME: 55,
            AUTOPLAY_RETRY: 3,
            LOADING_VIDEO_RETRY: 3
        };

        const API_ENDPOINTS = [
            url => `https://tikwm.com/api/?hd=1&url=${encodeURIComponent(url)}`,
            url => `https://api.tikwm.com/video/info?url=${encodeURIComponent(url)}`
        ];

        const STATUS = { IDLE:'idle', LOADING:'loading', DOWNLOADING:'downloading', CANCELLED:'cancelled', COMPLETED:'completed', ERROR:'error' };

        const STATE = {
            status: STATUS.IDLE,
            videoData: null,
            format: 'mp4',
            currentXHR: null,
            downloadGeneration: 0,
            isDownloading: false,
            autoplayRetried: false,
            logoAnimated: false
        };

        const DOM = {};
        ['loadingScreen','loadingDashboard','loadingBrand','loadingDots',
         'app','logoHero',
         'mainVideo','bannerFallback',
         'urlInput','inputWrapper','fetchBtn',
         'segIndicator','preview','previewImg','previewCaption','previewMeta',
         'filenameBox','filenameInput','filenameExt','filenameStatus',
         'progressWrap','loadingVideo','cancelBtn','pctTop','pctBig','pctLabel','barFill',
         'downloadBtn','downloadText','toastWrap'
        ].forEach(id => DOM[id] = document.getElementById(id));
        DOM.segBtns = document.querySelectorAll('.seg-btn');

        // ============================================================
        // 2. UTILITY
        // ============================================================
        const fmtNum = n => {
            if (!n) return '0';
            n = Number(n);
            if (n >= 1e9) return (n/1e9).toFixed(1)+'B';
            if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
            if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
            return n.toString();
        };
        const fmtDur = s => {
            if (!s) return '0:00';
            s = Math.floor(Number(s));
            const m = Math.floor(s/60), sec = s%60;
            return `${m}:${sec.toString().padStart(2,'0')}`;
        };
        const debounce = (fn, d) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), d); }; };
        const truncate = (t, m=120) => !t ? 'Tanpa judul' : (t.length>m ? t.slice(0,m).trim()+'...' : t);
        const sanitizeName = s => (s||'').toString().replace(/[<>:"/\\|?*\x00-\x1F]/g,'').replace(/\s+/g,' ').trim().slice(0, CONFIG.MAX_FILENAME);
        const raf = fn => new Promise(r => requestAnimationFrame(() => { fn(); r(); }));

        function toast(msg, type='info', dur=CONFIG.TOAST_MS) {
            const t = document.createElement('div');
            t.className = 'toast ' + (type==='error'?'err':type==='warning'?'warn':'');
            const ic = type==='error' ? 'fa-circle-exclamation'
                   : type==='warning' ? 'fa-triangle-exclamation'
                   : type==='success' ? 'fa-circle-check' : 'fa-circle-info';
            t.innerHTML = `<i class="fas ${ic}"></i><span></span>`;
            t.querySelector('span').textContent = msg;
            DOM.toastWrap.appendChild(t);
            setTimeout(() => {
                t.classList.add('out');
                setTimeout(() => t.remove(), 420);
            }, dur);
        }

        // ============================================================
        // 3. ANIMASI DASHBOARD.JPG TERBANG JADI LOGO (FLIP TECHNIQUE)
        // ============================================================
        async function animateLogoToHero() {
            if (STATE.logoAnimated) return;
            STATE.logoAnimated = true;

            const fromEl = DOM.loadingDashboard;
            const toEl = DOM.logoHero;

            // Sembunyikan teks & dots loading dengan smooth
            DOM.loadingBrand.style.opacity = '0';
            DOM.loadingDots.style.opacity = '0';

            // 1. Ambil posisi AWAL (di tengah layar)
            const fromRect = fromEl.getBoundingClientRect();
            const fromW = fromRect.width;
            const fromH = fromRect.height;

            // 2. Tunggu 1 frame agar layout stabil
            await raf(()=>{});

            // 3. CLONE elemen untuk terbang (yang asli kita sembunyikan)
            const flyer = fromEl.cloneNode(true);
            flyer.id = '';
            flyer.className = 'flying-logo';
            flyer.style.width = fromW + 'px';
            flyer.style.height = fromH + 'px';
            flyer.style.left = fromRect.left + 'px';
            flyer.style.top = fromRect.top + 'px';
            flyer.style.borderRadius = getComputedStyle(fromEl).borderRadius;
            flyer.animate = null; // nonaktifkan animasi float lama
            flyer.style.animation = 'none';
            document.body.appendChild(flyer);

            // 4. Sembunyikan yang asli
            fromEl.style.visibility = 'hidden';
            DOM.loadingScreen.classList.add('hidden');

            // 5. Tunggu logo target ada di layout, ambil posisi AKHIR
            await raf(()=>{});
            await new Promise(r => setTimeout(r, 50));
            const toRect = toEl.getBoundingClientRect();

            // 6. HITUNG DELTA untuk FLIP
            const deltaX = fromRect.left - toRect.left;
            const deltaY = fromRect.top - toRect.top;
            const scaleX = fromW / toRect.width;
            const scaleY = fromH / toRect.height;

            // 7. SET flyer ke posisi AKHIR, tapi di-transform ke AWAL
            flyer.style.left = toRect.left + 'px';
            flyer.style.top = toRect.top + 'px';
            flyer.style.width = toRect.width + 'px';
            flyer.style.height = toRect.height + 'px';
            flyer.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(${scaleX}, ${scaleY})`;
            flyer.style.borderRadius = getComputedStyle(fromEl).borderRadius;

            // 8. Tunggu 1 frame, lalu HAPUS transform → animasi ke posisi AKHIR
            await raf(()=>{});
            flyer.style.transform = 'translate(0,0) scale(1,1)';
            flyer.style.borderRadius = '50%';

            // 9. Setelah animasi selesai: tampilkan target asli, hapus flyer
            flyer.addEventListener('transitionend', function onEnd(e) {
                if (e.propertyName !== 'transform') return;
                flyer.removeEventListener('transitionend', onEnd);
                toEl.classList.add('ready');
                setTimeout(() => {
                    flyer.style.opacity = '0';
                    setTimeout(() => flyer.remove(), 520);
                }, 60);
                // 10. Baru munculkan APP dengan staggered animasi
                setTimeout(() => DOM.app.classList.add('show'), 120);
            }, { once: true });
        }

        // ============================================================
        // 4. MEDIA PLAYBACK ROBUST
        // ============================================================
        const MEDIA = {
            async safePlay(video, maxRetries=2) {
                if (!video) return false;
                try {
                    video.muted = true;
                    video.setAttribute('muted','');
                    video.setAttribute('playsinline','');
                    video.setAttribute('webkit-playsinline','');
                    if (video.paused) { try { video.currentTime = 0; } catch(e){} }
                    const p = video.play();
                    if (p && typeof p.catch === 'function') await p;
                    return true;
                } catch (e) {
                    if (maxRetries > 0) {
                        await new Promise(r => setTimeout(r, 260));
                        return MEDIA.safePlay(video, maxRetries - 1);
                    }
                    return false;
                }
            },
            safeStop(video) {
                if (!video) return;
                try { video.pause(); video.currentTime = 0; } catch(e){}
            }
        };

        DOM.mainVideo.addEventListener('error', () => {
            DOM.mainVideo.style.display = 'none';
            DOM.bannerFallback.style.display = 'flex';
        });
        DOM.mainVideo.addEventListener('stalled', () => MEDIA.safePlay(DOM.mainVideo, 1));
        DOM.mainVideo.addEventListener('suspend', () => MEDIA.safePlay(DOM.mainVideo, 1));

        // ============================================================
        // 5. API LAYER
        // ============================================================
        async function trySingleAPI(fullUrl) {
            try {
                const ctrl = new AbortController();
                const tm = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT_SINGLE);
                const r = await fetch(fullUrl, { signal: ctrl.signal, headers: { 'Accept':'application/json' } });
                clearTimeout(tm);
                if (!r.ok) return null;
                const j = await r.json();
                if (j && (j.code === 0 || j.code === '0') && j.data && (j.data.play || j.data.hdplay || (j.data.music && j.data.music.play))) return j.data;
                if (j && j.data && (j.data.play || j.data.hdplay)) return j.data;
                if (j && (j.play || j.hdplay)) return j;
                return null;
            } catch (e) { return null; }
        }

        async function fetchVideoMeta(tiktokUrl) {
            const tmOut = new Promise((_,rej) => setTimeout(()=>rej(new Error('timeout')), CONFIG.API_TIMEOUT_TOTAL));
            try {
                const results = await Promise.race([
                    Promise.all(API_ENDPOINTS.map(fn => trySingleAPI(fn(tiktokUrl)))),
                    tmOut
                ]);
                const data = results.find(d => !!d);
                if (!data) throw new Error('empty');
                return data;
            } catch (e) { throw e; }
        }

        function validateTikTokUrl(u) {
            if (!u || !u.trim()) return false;
            const ok = /tiktok/i.test(u) && /https?:\/\//i.test(u);
            DOM.inputWrapper.classList.toggle('error', !ok && u.length > 0);
            return ok;
        }

        // ============================================================
        // 6. PREVIEW RENDER
        // ============================================================
        function renderPreview(d) {
            STATE.videoData = d;
            const cover = d.cover || d.ai_dynamic_cover || d.origin_cover || d.images?.[0];
            if (cover) {
                DOM.previewImg.style.display = '';
                DOM.previewImg.src = cover;
                DOM.previewImg.onerror = () => { DOM.previewImg.style.display = 'none'; };
            } else {
                DOM.previewImg.style.display = 'none';
            }
            DOM.previewCaption.textContent = truncate(d.title);
            DOM.previewMeta.innerHTML = `
                <span><i class="fas fa-heart"></i> ${fmtNum(d.digg_count)}</span>
                <span><i class="fas fa-eye"></i> ${fmtNum(d.play_count)}</span>
                <span><i class="fas fa-comment"></i> ${fmtNum(d.comment_count)}</span>
                <span><i class="fas fa-share"></i> ${fmtNum(d.share_count)}</span>
                <span><i class="fas fa-clock"></i> ${fmtDur(d.duration)}</span>
            `;
            DOM.preview.classList.add('show');

            const vid = d.id || d.video_id || Date.now();
            STATE.defaultFilename = sanitizeName(`tiktok_${vid}`) || `tiktok_${Date.now()}`;
            DOM.filenameInput.value = '';
            DOM.filenameStatus.className = 'filename-status';
            DOM.filenameStatus.textContent = '';
            DOM.filenameBox.classList.add('show');

            DOM.downloadBtn.disabled = false;
            updateDownloadText();
        }

        function updateDownloadText() {
            DOM.downloadText.textContent = `DOWNLOAD ${STATE.format.toUpperCase()}`;
            DOM.filenameExt.textContent = `.${STATE.format}`;
        }

        function getDownloadUrl() {
            const d = STATE.videoData;
            if (!d) return null;
            if (STATE.format === 'mp3') return d.music?.play || d.music?.url || d.music_info?.play || null;
            return d.hdplay || d.play || d.wmplay || null;
        }

        function getFinalFilename() {
            const custom = sanitizeName(DOM.filenameInput.value);
            const base = custom || STATE.defaultFilename || 'tiktok_download';
            return `${base}.${STATE.format}`;
        }

        // ============================================================
        // 7. DOWNLOAD SYSTEM - DUAL MODE + ANTI RACE
        // ============================================================
        function triggerDirectDownload(url, filename) {
            try {
                const a = document.createElement('a');
                a.href = url; a.download = filename; a.rel = 'noopener'; a.target = '_blank';
                document.body.appendChild(a); a.click();
                setTimeout(() => a.remove(), 500);
                return true;
            } catch (e) {
                window.open(url, '_blank', 'noopener');
                return false;
            }
        }
        function saveBlob(blob, filename) {
            try {
                const u = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = u; a.download = filename;
                document.body.appendChild(a); a.click();
                setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 1500);
                return true;
            } catch (e) { return false; }
        }

        function resetProgressUI(soft=false) {
            MEDIA.safeStop(DOM.loadingVideo);
            DOM.progressWrap.classList.remove('show');
            DOM.downloadBtn.style.display = '';
            DOM.barFill.style.width = '0%';
            DOM.pctBig.textContent = '0%';
            DOM.pctTop.textContent = '0% • Memulai...';
            DOM.pctLabel.textContent = 'Sedang mengunduh...';
            if (!soft) {
                STATE.currentXHR = null;
                STATE.isDownloading = false;
                STATE.status = STATUS.IDLE;
                DOM.downloadBtn.disabled = !STATE.videoData;
            }
        }

        function setProgress(pct, label='Sedang mengunduh...') {
            pct = Math.max(0, Math.min(100, Math.round(pct)));
            DOM.barFill.style.width = pct + '%';
            DOM.pctBig.textContent = pct + '%';
            DOM.pctTop.textContent = `${pct}% • ${label}`;
        }

        async function startDownload() {
            const url = getDownloadUrl();
            const fname = getFinalFilename();
            if (!url) { toast('Link download tidak tersedia', 'error', 4500); return; }
            if (STATE.isDownloading) return;

            const custom = DOM.filenameInput.value.trim();
            if (custom.length > 0 && !sanitizeName(custom)) {
                toast('Nama file tidak valid', 'error');
                DOM.filenameStatus.className = 'filename-status err';
                DOM.filenameStatus.innerHTML = '<i class="fas fa-times"></i>';
                return;
            }

            STATE.isDownloading = true;
            STATE.status = STATUS.DOWNLOADING;
            STATE.downloadGeneration += 1;
            const myGeneration = STATE.downloadGeneration;
            let cancelled = false;

            DOM.downloadBtn.style.display = 'none';
            DOM.progressWrap.classList.add('show');
            setProgress(0, 'Memulai...');
            DOM.pctLabel.textContent = 'Menyiapkan unduhan...';

            MEDIA.safePlay(DOM.loadingVideo, CONFIG.LOADING_VIDEO_RETRY).catch(()=>{});

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', url, true);
                xhr.responseType = 'blob';
                STATE.currentXHR = xhr;

                xhr.onprogress = e => {
                    if (myGeneration !== STATE.downloadGeneration || cancelled) return;
                    if (e.lengthComputable) {
                        const pct = (e.loaded / e.total) * 100;
                        setProgress(pct, `${(e.loaded/1048576).toFixed(1)} / ${(e.total/1048576).toFixed(1)} MB`);
                        DOM.pctLabel.textContent = 'Sedang mengunduh...';
                    } else {
                        DOM.pctBig.textContent = '...';
                        DOM.pctTop.textContent = 'Mengunduh...';
                        DOM.pctLabel.textContent = 'Sedang mengunduh (proses di latar belakang)';
                        DOM.barFill.style.width = '100%';
                        DOM.barFill.style.opacity = '0.55';
                    }
                };

                xhr.onload = () => {
                    if (myGeneration !== STATE.downloadGeneration || cancelled) return;
                    DOM.barFill.style.opacity = '';
                    if (xhr.status >= 200 && xhr.status < 300 && xhr.response) {
                        const ok = saveBlob(xhr.response, fname);
                        setProgress(100, 'Selesai');
                        STATE.status = STATUS.COMPLETED;
                        toast(ok ? '✓ Download selesai!' : 'File siap disimpan', 'success');
                    } else {
                        STATE.status = STATUS.ERROR;
                        toast(`Gagal: HTTP ${xhr.status || 'error'}`, 'error', 4500);
                    }
                    setTimeout(() => resetProgressUI(), 950);
                };

                xhr.onerror = () => {
                    if (myGeneration !== STATE.downloadGeneration || cancelled) return;
                    DOM.barFill.style.opacity = '';
                    console.warn('[Download] XHR error → fallback direct');
                    STATE.status = STATUS.IDLE;
                    resetProgressUI(true);
                    const ok = triggerDirectDownload(url, fname);
                    toast(ok ? 'Membuka unduhan...' : 'Membuka di tab baru...', ok ? 'info' : 'warning');
                    STATE.isDownloading = false;
                    STATE.currentXHR = null;
                };

                xhr.onabort = () => {
                    if (myGeneration !== STATE.downloadGeneration) return;
                    cancelled = true;
                    DOM.barFill.style.opacity = '';
                    STATE.status = STATUS.CANCELLED;
                    toast('Download dibatalkan', 'warning');
                    resetProgressUI();
                };

                xhr.ontimeout = () => {
                    if (myGeneration !== STATE.downloadGeneration || cancelled) return;
                    DOM.barFill.style.opacity = '';
                    STATE.status = STATUS.ERROR;
                    toast('Timeout, coba lagi', 'error');
                    resetProgressUI();
                };

                xhr.timeout = 0;

                DOM.cancelBtn.onclick = () => {
                    if (myGeneration !== STATE.downloadGeneration) return;
                    cancelled = true;
                    try { if (xhr.readyState < 4) xhr.abort(); } catch(e){}
                };

                xhr.send();

            } catch (e) {
                console.warn('[Download] XHR exception → fallback', e);
                resetProgressUI(true);
                triggerDirectDownload(url, fname);
                toast('Membuka unduhan...', 'info');
            }
        }

        // ============================================================
        // 8. FETCH FLOW
        // ============================================================
        async function handleFetch() {
            const url = DOM.urlInput.value.trim();
            if (!validateTikTokUrl(url)) {
                toast('Link TikTok tidak valid', 'error', 4500);
                return;
            }
            if (STATE.status === STATUS.LOADING || STATE.status === STATUS.DOWNLOADING) return;

            STATE.status = STATUS.LOADING;
            DOM.fetchBtn.disabled = true;
            DOM.urlInput.disabled = true;
            DOM.downloadBtn.disabled = true;
            DOM.preview.classList.remove('show');
            DOM.filenameBox.classList.remove('show');

            toast('Sedang mengambil data video...', 'info');

            try {
                const data = await fetchVideoMeta(url);
                renderPreview(data);
                toast('✓ Video siap diunduh', 'success');
            } catch (e) {
                let msg = 'Gagal mengambil data. Coba lagi';
                if (e.message === 'timeout') msg = 'Koneksi lambat, silakan coba lagi';
                else if (e.message === 'empty') msg = 'Video tidak dapat diakses (private/terhapus)';
                toast(msg, 'error', 5000);
            } finally {
                STATE.status = STATE.videoData ? STATUS.IDLE : STATUS.ERROR;
                DOM.fetchBtn.disabled = false;
                DOM.urlInput.disabled = false;
                if (!STATE.videoData) DOM.downloadBtn.disabled = true;
                setTimeout(() => DOM.urlInput.focus(), 50);
            }
        }

        // ============================================================
        // 9. EVENT BINDINGS
        // ============================================================
        function bindEvents() {
            DOM.urlInput.addEventListener('keydown', e => {
                if (e.key === 'Enter' && STATE.status !== STATUS.LOADING && STATE.status !== STATUS.DOWNLOADING) {
                    e.preventDefault();
                    handleFetch();
                }
            });
            DOM.urlInput.addEventListener('input', debounce(() => validateTikTokUrl(DOM.urlInput.value), CONFIG.INPUT_DEBOUNCE));
            DOM.fetchBtn.addEventListener('click', handleFetch);

            const retryMain = () => {
                if (STATE.autoplayRetried) return;
                STATE.autoplayRetried = true;
                MEDIA.safePlay(DOM.mainVideo, CONFIG.AUTOPLAY_RETRY).catch(()=>{});
                ['click','touchstart','keydown'].forEach(ev => document.removeEventListener(ev, retryMain));
            };
            ['click','touchstart','keydown'].forEach(ev => document.addEventListener(ev, retryMain, { passive:true }));

            DOM.segBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const fmt = btn.dataset.format;
                    if (fmt === STATE.format) return;
                    STATE.format = fmt;
                    DOM.segBtns.forEach(b => {
                        const a = b === btn;
                        b.classList.toggle('active', a);
                        b.setAttribute('aria-selected', a ? 'true' : 'false');
                    });
                    DOM.segIndicator.classList.toggle('right', fmt === 'mp3');
                    updateDownloadText();
                });
            });

            DOM.filenameInput.addEventListener('input', e => {
                const raw = e.target.value;
                const clean = sanitizeName(raw);
                if (clean !== raw) e.target.value = clean;
                const s = DOM.filenameStatus;
                if (!clean) { s.className = 'filename-status'; s.innerHTML = ''; }
                else { s.className = 'filename-status ok'; s.innerHTML = '<i class="fas fa-check"></i>'; }
            });

            DOM.downloadBtn.addEventListener('click', startDownload);

            window.addEventListener('beforeunload', () => {
                try { if (STATE.currentXHR) STATE.currentXHR.abort(); } catch(e){}
            });
        }

        // ============================================================
        // 10. INIT
        // ============================================================
        function init() {
            bindEvents();

            setTimeout(async () => {
                // 1. Jalankan animasi logo terbang
                await animateLogoToHero();

                // 2. Setelah app muncul, coba main.mp4
                setTimeout(() => {
                    MEDIA.safePlay(DOM.mainVideo, CONFIG.AUTOPLAY_RETRY).catch(()=>{});
                    setTimeout(() => DOM.urlInput.focus(), 300);
                }, 750);
            }, CONFIG.LOADING_MS);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
    </script>
</body>
</html>
