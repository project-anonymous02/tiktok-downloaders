<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TikTok Downloader Premium - Download video TikTok tanpa watermark dalam format MP3 atau MP4">
    <meta name="theme-color" content="#1e8b4c">
    <title>Nata Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== CSS RESET & VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1e8b4c;
            --primary-light: #25d366;
            --primary-dark: #0f3b28;
            --primary-darker: #051f15;
            --secondary: #2a2a3e;
            --secondary-light: #3d3d52;
            --accent: #25d366;
            --accent-light: #4ade80;
            --error: #ef4444;
            --success: #25d366;
            --warning: #f97316;
            
            --bg-dark: #0f0f23;
            --bg-darker: #0a0a1a;
            --card-bg: #1a1a2e;
            --card-bg-light: #232338;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c0;
            --text-tertiary: #8080a0;
            --border-color: #2a2a3e;
            --border-light: #3a3a52;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
            --spacing-2xl: 32px;
            --spacing-3xl: 48px;
            
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --transition-fast: 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-normal: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-slow: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 24px 64px rgba(30, 139, 76, 0.2);
            
            --font-primary: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-primary);
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-lg);
            overflow-y: auto;
        }

        /* ===== LOADING SCREEN ===== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--primary-darker) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity var(--transition-slow), visibility var(--transition-slow);
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-3xl);
            animation: fadeInScale 0.8s var(--transition-normal) 0.3s backwards;
        }

        .loading-card-container {
            position: relative;
            width: 240px;
            height: 240px;
        }

        .loading-card {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg-light) 100%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 20px 60px rgba(30, 139, 76, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: floatUp 3s ease-in-out infinite, glow 3s ease-in-out infinite;
        }

        .loading-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top: 3px solid var(--primary);
            border-radius: var(--radius-xl);
            animation: spin 2s linear infinite;
        }

        .loading-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
            animation: fadeIn 1s var(--transition-normal) 0.6s backwards;
        }

        .loading-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .loading-subtitle {
            font-size: 12px;
            color: var(--text-tertiary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .spinner-dots {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        .spinner-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 1.4s infinite;
        }

        .spinner-dot:nth-child(1) { animation-delay: 0s; }
        .spinner-dot:nth-child(2) { animation-delay: 0.2s; }
        .spinner-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes floatUp {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 20px 60px rgba(30, 139, 76, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 30px 80px rgba(30, 139, 76, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.15); }
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* ===== MAIN APP CARD ===== */
        .app-container {
            width: 100%;
            max-width: 900px;
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg-light) 100%);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-light);
            padding: var(--spacing-3xl);
            box-shadow: var(--shadow-xl);
            opacity: 0;
            transform: translateY(40px);
            transition: all var(--transition-slow);
            max-height: 95vh;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .app-container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .app-container:hover {
            border-color: var(--primary);
            box-shadow: 0 24px 80px rgba(30, 139, 76, 0.3);
        }

        /* ===== SCROLLBAR ===== */
        .app-container::-webkit-scrollbar {
            width: 8px;
        }

        .app-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .app-container::-webkit-scrollbar-thumb {
            background: var(--border-light);
            border-radius: 4px;
            transition: background var(--transition-fast);
        }

        .app-container::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* ===== HEADER SECTION ===== */
        .header-section {
            text-align: center;
            margin-bottom: var(--spacing-3xl);
            padding-bottom: var(--spacing-2xl);
            border-bottom: 1px solid var(--border-color);
            animation: slideDownFade 0.6s var(--transition-normal) 0.2s backwards;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 30px rgba(30, 139, 76, 0.3);
            animation: spinGlow 3s linear infinite;
        }

        @keyframes spinGlow {
            0% { transform: rotate(0deg); box-shadow: 0 10px 30px rgba(30, 139, 76, 0.3); }
            50% { box-shadow: 0 15px 50px rgba(30, 139, 76, 0.5); }
            100% { transform: rotate(360deg); box-shadow: 0 10px 30px rgba(30, 139, 76, 0.3); }
        }

        .app-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: var(--spacing-sm);
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideDownFade 0.6s var(--transition-normal) 0.3s backwards;
        }

        .app-subtitle {
            font-size: 14px;
            color: var(--text-tertiary);
            margin-bottom: var(--spacing-lg);
            animation: slideDownFade 0.6s var(--transition-normal) 0.4s backwards;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        .feature-badge {
            background: rgba(30, 139, 76, 0.15);
            border: 1px solid var(--primary);
            padding: var(--spacing-md) var(--spacing-lg);
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-align: center;
            transition: all var(--transition-fast);
            animation: slideUpFade 0.6s var(--transition-normal) backward;
        }

        .feature-badge:nth-child(1) { animation-delay: 0.4s; }
        .feature-badge:nth-child(2) { animation-delay: 0.5s; }
        .feature-badge:nth-child(3) { animation-delay: 0.6s; }
        .feature-badge:nth-child(4) { animation-delay: 0.7s; }

        .feature-badge:hover {
            background: rgba(30, 139, 76, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(30, 139, 76, 0.2);
        }

        @keyframes slideDownFade {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== INPUT SECTION ===== */
        .input-section {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            animation: slideUpFade 0.6s var(--transition-normal) 0.5s backwards;
        }

        .input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .url-input {
            width: 100%;
            padding: var(--spacing-lg) var(--spacing-xl);
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 15px;
            font-family: var(--font-primary);
            transition: all var(--transition-fast);
            outline: none;
        }

        .url-input::placeholder {
            color: var(--text-tertiary);
        }

        .url-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 139, 76, 0.2), var(--shadow-md);
            background: linear-gradient(135deg, var(--bg-dark) 0%, rgba(30, 139, 76, 0.05) 100%);
        }

        .url-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .input-icon {
            position: absolute;
            right: var(--spacing-xl);
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 16px;
            pointer-events: none;
            transition: all var(--transition-fast);
        }

        .url-input:focus ~ .input-icon {
            color: var(--accent);
            transform: translateY(-50%) scale(1.2);
        }

        .btn-fetch {
            padding: var(--spacing-lg) var(--spacing-2xl);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            white-space: nowrap;
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .btn-fetch::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left var(--transition-normal);
        }

        .btn-fetch:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-fetch:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(30, 139, 76, 0.4);
        }

        .btn-fetch:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-fetch:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== FORMAT TOGGLE ===== */
        .format-section {
            margin-bottom: var(--spacing-xl);
            animation: slideUpFade 0.6s var(--transition-normal) 0.6s backwards;
        }

        .format-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-md);
        }

        .format-toggle {
            display: flex;
            gap: var(--spacing-md);
            background: var(--bg-dark);
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }

        .format-btn {
            flex: 1;
            padding: var(--spacing-md) var(--spacing-lg);
            background: transparent;
            border: 2px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            position: relative;
        }

        .format-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(30, 139, 76, 0.1), rgba(37, 211, 102, 0.1));
            border-radius: var(--radius-md);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .format-btn:hover:not(.active) {
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .format-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 8px 20px rgba(30, 139, 76, 0.3);
        }

        /* ===== PREVIEW SECTION ===== */
        .preview-section {
            display: none;
            margin-bottom: var(--spacing-xl);
            padding: var(--spacing-xl);
            background: linear-gradient(135deg, rgba(30, 139, 76, 0.1), rgba(37, 211, 102, 0.05));
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(10px);
            animation: slideUpFade 0.6s var(--transition-normal);
        }

        .preview-section.show {
            display: block;
        }

        .preview-thumbnail-container {
            position: relative;
            width: 100%;
            margin-bottom: var(--spacing-lg);
            overflow: hidden;
            border-radius: var(--radius-lg);
            aspect-ratio: 16/9;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
        }

        .preview-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: zoomIn 0.6s var(--transition-normal);
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .preview-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            transition: all var(--transition-fast);
        }

        .preview-thumbnail-container:hover .preview-play-icon {
            background: rgba(30, 139, 76, 0.8);
            transform: translate(-50%, -50%) scale(1.1);
        }

        .preview-info {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .preview-caption {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            word-break: break-word;
        }

        .preview-metadata {
            display: flex;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--text-tertiary);
        }

        .metadata-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        /* ===== FILENAME SECTION ===== */
        .filename-section {
            display: none;
            margin-bottom: var(--spacing-xl);
            animation: slideUpFade 0.6s var(--transition-normal) 0.1s backwards;
        }

        .filename-section.show {
            display: block;
        }

        .filename-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: var(--spacing-md);
        }

        .filename-input-group {
            display: flex;
            gap: var(--spacing-md);
            align-items: stretch;
        }

        .filename-input {
            flex: 1;
            padding: var(--spacing-lg) var(--spacing-xl);
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-primary);
            transition: all var(--transition-fast);
            outline: none;
        }

        .filename-input::placeholder {
            color: var(--text-tertiary);
        }

        .filename-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 139, 76, 0.2);
            background: linear-gradient(135deg, var(--bg-dark) 0%, rgba(30, 139, 76, 0.05) 100%);
        }

        .filename-extension {
            display: flex;
            align-items: center;
            padding: 0 var(--spacing-lg);
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 600;
            min-width: 80px;
            text-align: center;
            border-left: none;
            margin-left: -2px;
        }

        .filename-status {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: var(--bg-dark);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            color: var(--text-tertiary);
            font-size: 16px;
            transition: all var(--transition-fast);
        }

        .filename-status.valid {
            color: var(--success);
            border-color: var(--success);
            background: rgba(37, 211, 102, 0.1);
        }

        .filename-status.invalid {
            color: var(--error);
            border-color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .filename-helper {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: var(--spacing-md);
            display: none;
        }

        .filename-helper.show {
            display: block;
        }

        .filename-helper.error {
            color: var(--error);
        }

        /* ===== DOWNLOAD BUTTON ===== */
        .download-section {
            margin-bottom: var(--spacing-xl);
            animation: slideUpFade 0.6s var(--transition-normal) 0.7s backwards;
        }

        .btn-download {
            width: 100%;
            padding: var(--spacing-lg) var(--spacing-2xl);
            height: 56px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: var(--radius-lg);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left var(--transition-normal);
        }

        .btn-download:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 16px 60px rgba(30, 139, 76, 0.5);
        }

        .btn-download:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ===== PROGRESS CONTAINER ===== */
        .progress-container {
            display: none;
            height: 240px;
            position: relative;
            margin-bottom: var(--spacing-xl);
            overflow: hidden;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, var(--bg-dark) 0%, rgba(30, 139, 76, 0.05) 100%);
            border: 1px solid var(--border-light);
            animation: slideUpFade 0.6s var(--transition-normal);
        }

        .progress-container.show {
            display: flex;
        }

        .progress-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .progress-info {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            gap: var(--spacing-lg);
        }

        .progress-percentage {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .progress-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .progress-bar-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
            width: 0%;
            transition: width 0.2s linear;
            box-shadow: 0 0 20px rgba(30, 139, 76, 0.6);
        }

        .progress-cancel {
            position: absolute;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all var(--transition-fast);
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .progress-cancel:hover {
            background: rgba(0, 0, 0, 0.7);
            transform: scale(1.1);
        }

        /* ===== TOAST NOTIFICATIONS ===== */
        .toast-container {
            position: fixed;
            top: var(--spacing-2xl);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            pointer-events: none;
        }

        .toast {
            background: linear-gradient(135deg, var(--card-bg) 0%, var(--card-bg-light) 100%);
            border: 1px solid var(--border-light);
            padding: var(--spacing-lg) var(--spacing-xl);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            font-size: 14px;
            color: var(--text-primary);
            animation: slideDownFade 0.4s var(--transition-normal);
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--primary);
            pointer-events: auto;
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--error);
        }

        .toast.info {
            border-left-color: var(--primary);
        }

        .toast.warning {
            border-left-color: var(--warning);
        }

        .toast i {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast.success i {
            color: var(--success);
        }

        .toast.error i {
            color: var(--error);
        }

        .toast.info i {
            color: var(--primary);
        }

        .toast.warning i {
            color: var(--warning);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: var(--spacing-3xl);
            padding-top: var(--spacing-2xl);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-tertiary);
            animation: slideUpFade 0.6s var(--transition-normal) 0.8s backwards;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            transition: all var(--transition-fast);
        }

        .footer a:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .app-container {
                padding: var(--spacing-xl);
            }

            .app-title {
                font-size: 28px;
            }

            .input-section {
                flex-direction: column;
            }

            .url-input {
                padding: var(--spacing-lg) var(--spacing-lg);
            }

            .btn-fetch {
                padding: var(--spacing-lg) var(--spacing-xl);
            }

            .format-toggle {
                flex-direction: column;
            }

            .format-btn {
                width: 100%;
            }

            .filename-input-group {
                flex-wrap: wrap;
            }

            .filename-extension {
                flex: 1;
            }

            .logo-icon {
                width: 50px;
                height: 50px;
                font-size: 28px;
            }

            .loading-card {
                width: 180px;
                height: 180px;
                font-size: 64px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: var(--spacing-md);
            }

            .app-container {
                padding: var(--spacing-xl) var(--spacing-lg);
                border-radius: var(--radius-lg);
            }

            .app-title {
                font-size: 24px;
            }

            .app-subtitle {
                font-size: 12px;
            }

            .features-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .feature-badge {
                font-size: 11px;
                padding: var(--spacing-sm) var(--spacing-md);
            }

            .url-input,
            .filename-input {
                padding: var(--spacing-md) var(--spacing-lg);
                font-size: 14px;
            }

            .btn-fetch,
            .btn-download {
                padding: var(--spacing-lg);
                height: auto;
                font-size: 14px;
            }

            .preview-metadata {
                font-size: 12px;
                gap: var(--spacing-md);
            }

            .progress-percentage {
                font-size: 36px;
            }

            .filename-input-group {
                flex-direction: column;
            }

            .filename-extension {
                width: 100%;
                border-left: 2px solid var(--border-color);
                margin-left: 0;
            }

            .filename-status {
                width: 100%;
            }

            .input-icon {
                right: var(--spacing-lg);
            }
        }

        /* ===== ACCESSIBILITY ===== */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== UTILITY CLASSES ===== */
        .hidden {
            display: none !important;
        }

        .disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
            pointer-events: none !important;
        }
    </style>
</head>
<body>
    <!-- LOADING SCREEN -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-card-container">
                <div class="loading-ring"></div>
                <div class="loading-card">📥</div>
            </div>
            <div class="loading-text">
                <div class="loading-title">TIKTOK DOWNLOADER</div>
                <div class="loading-subtitle">Premium Edition</div>
                <div class="spinner-dots">
                    <div class="spinner-dot"></div>
                    <div class="spinner-dot"></div>
                    <div class="spinner-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="app-container" id="appContainer">
        <!-- HEADER -->
        <div class="header-section">
            <div class="logo-container">
                <div class="logo-icon">🎵</div>
            </div>
            <h1 class="app-title">TIKTOK DOWNLOADER</h1>
            <p class="app-subtitle">Download videos without watermarks • MP3 & MP4</p>
            <div class="features-grid">
                <div class="feature-badge">⚡ Ultra Fast</div>
                <div class="feature-badge">🔒 Secure</div>
                <div class="feature-badge">✨ No WM</div>
                <div class="feature-badge">🎬 HD Quality</div>
            </div>
        </div>

        <!-- INPUT SECTION -->
        <div class="input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    class="url-input" 
                    id="urlInput" 
                    placeholder="Paste TikTok URL here..."
                    aria-label="TikTok video URL"
                >
                <i class="fas fa-link input-icon"></i>
            </div>
            <button class="btn-fetch" id="processBtn" aria-label="Fetch video">
                <i class="fas fa-bolt"></i>
                Fetch
            </button>
        </div>

        <!-- FORMAT SECTION -->
        <div class="format-section">
            <label class="format-label">Download Format</label>
            <div class="format-toggle">
                <button class="format-btn active" data-format="mp4" aria-label="Download as MP4">
                    <i class="fas fa-film"></i> MP4 Video
                </button>
                <button class="format-btn" data-format="mp3" aria-label="Download as MP3">
                    <i class="fas fa-music"></i> MP3 Audio
                </button>
            </div>
        </div>

        <!-- PREVIEW SECTION -->
        <div class="preview-section" id="previewSection">
            <div class="preview-thumbnail-container">
                <img class="preview-thumbnail" id="previewThumbnail" alt="Video thumbnail">
                <div class="preview-play-icon">
                    <i class="fas fa-play"></i>
                </div>
            </div>
            <div class="preview-info">
                <div class="preview-caption" id="previewCaption"></div>
                <div class="preview-metadata" id="previewMetadata"></div>
            </div>
        </div>

        <!-- FILENAME SECTION -->
        <div class="filename-section" id="filenameSection">
            <label class="filename-label">File Name</label>
            <div class="filename-input-group">
                <input 
                    type="text" 
                    class="filename-input" 
                    id="filenameInput"
                    placeholder="Auto-generated"
                    aria-label="Custom filename"
                >
                <div class="filename-extension" id="filenameExtension">.mp4</div>
                <div class="filename-status" id="filenameStatus"></div>
            </div>
            <div class="filename-helper" id="filenameHelper"></div>
        </div>

        <!-- PROGRESS CONTAINER -->
        <div class="progress-container" id="progressContainer">
            <video class="progress-video" id="progressVideo" autoplay loop muted></video>
            <div class="progress-info">
                <div class="progress-percentage" id="progressPercentage">0%</div>
                <div class="progress-text" id="progressText">Downloading...</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <button class="progress-cancel" id="progressCancel" aria-label="Cancel download">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- DOWNLOAD BUTTON -->
        <div class="download-section">
            <button class="btn-download" id="downloadBtn" aria-label="Download video">
                <i class="fas fa-download"></i>
                <span id="downloadBtnText">DOWNLOAD MP4</span>
            </button>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2025 nata~ ❤️ | 
            <a href="#" onclick="return false;">Privacy</a> • 
            <a href="#" onclick="return false;">Terms</a>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ===== CONSTANTS & CONFIG =====
        const CONFIG = {
            LOADING_DURATION: 6000,
            API_TIMEOUT_SINGLE: 5000,
            API_TIMEOUT_OVERALL: 6000,
            INPUT_DEBOUNCE: 300,
            TOAST_DURATION: 3000,
            MAX_FILENAME_LENGTH: 50,
        };

        const API_ENDPOINTS = [
            (url) => `https://tikwm.com/api/?url=${encodeURIComponent(url)}`,
            (url) => `https://api.tikwm.com/video/info?url=${encodeURIComponent(url)}`,
        ];

        // ===== STATE MANAGEMENT =====
        const STATE = {
            videoData: null,
            currentFormat: 'mp4',
            isLoading: false,
            isDownloading: false,
            currentFilename: '',
            currentXHR: null,
        };

        // ===== DOM ELEMENTS =====
        const DOM = {
            loadingScreen: document.getElementById('loadingScreen'),
            appContainer: document.getElementById('appContainer'),
            urlInput: document.getElementById('urlInput'),
            processBtn: document.getElementById('processBtn'),
            formatBtns: document.querySelectorAll('.format-btn'),
            previewSection: document.getElementById('previewSection'),
            previewThumbnail: document.getElementById('previewThumbnail'),
            previewCaption: document.getElementById('previewCaption'),
            previewMetadata: document.getElementById('previewMetadata'),
            filenameSection: document.getElementById('filenameSection'),
            filenameInput: document.getElementById('filenameInput'),
            filenameExtension: document.getElementById('filenameExtension'),
            filenameStatus: document.getElementById('filenameStatus'),
            filenameHelper: document.getElementById('filenameHelper'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadBtnText: document.getElementById('downloadBtnText'),
            progressContainer: document.getElementById('progressContainer'),
            progressPercentage: document.getElementById('progressPercentage'),
            progressText: document.getElementById('progressText'),
            progressBar: document.getElementById('progressBar'),
            progressCancel: document.getElementById('progressCancel'),
            toastContainer: document.getElementById('toastContainer'),
        };

        // ===== UTILITY FUNCTIONS =====
        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function formatDuration(seconds) {
            if (!seconds) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function debounce(func, delay) {
            let timeoutId;
            return function (...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => func(...args), delay);
            };
        }

        function validateURL(url) {
            const isValid = url.toLowerCase().includes('tiktok');
            DOM.urlInput.parentElement.classList.toggle('error', !isValid && url.length > 0);
            return isValid;
        }

        function sanitizeFilename(input) {
            return input
                .replace(/[<>:"/\\|?*]/g, '')
                .slice(0, CONFIG.MAX_FILENAME_LENGTH)
                .trim();
        }

        function validateFilename(filename) {
            const sanitized = sanitizeFilename(filename);
            const isValid = sanitized.length > 0;

            DOM.filenameStatus.classList.remove('valid', 'invalid');
            DOM.filenameHelper.classList.remove('show', 'error');

            if (filename.length === 0) {
                return true;
            }

            if (!isValid || filename.length > CONFIG.MAX_FILENAME_LENGTH) {
                DOM.filenameStatus.classList.add('invalid');
                DOM.filenameStatus.innerHTML = '<i class="fas fa-times"></i>';
                DOM.filenameHelper.classList.add('show', 'error');
                DOM.filenameHelper.textContent = 'Invalid filename';
                return false;
            }

            DOM.filenameStatus.classList.add('valid');
            DOM.filenameStatus.innerHTML = '<i class="fas fa-check"></i>';
            return true;
        }

        function showToast(message, type = 'info', duration = CONFIG.TOAST_DURATION) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            let icon = 'fa-info-circle';
            if (type === 'success') icon = 'fa-check-circle';
            if (type === 'error') icon = 'fa-exclamation-circle';
            if (type === 'warning') icon = 'fa-warning';

            toast.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            DOM.toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideUpFade 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) reverse';
                setTimeout(() => {
                    DOM.toastContainer.removeChild(toast);
                }, 300);
            }, duration);
        }

        function truncateText(text, maxLength = 100) {
            return text.length > maxLength ? text.slice(0, maxLength) + '...' : text;
        }

        // ===== API INTEGRATION =====
        async function tryAPI(url, timeoutMs = CONFIG.API_TIMEOUT_SINGLE) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

                const response = await fetch(url, {
                    signal: controller.signal,
                    headers: { 'Accept': 'application/json' }
                });

                clearTimeout(timeoutId);

                if (!response.ok) {
                    console.warn(`API error: HTTP ${response.status}`);
                    return null;
                }

                const json = await response.json();

                if (json?.data?.play || (json?.data?.music?.play)) {
                    return json.data;
                }

                return null;
            } catch (error) {
                console.warn('API error:', error.message);
                return null;
            }
        }

        async function fetchFromAPIs(url) {
            try {
                const timeoutPromise = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('Overall timeout')), CONFIG.API_TIMEOUT_OVERALL)
                );

                const apiPromises = API_ENDPOINTS.map(buildURL => tryAPI(buildURL(url)));
                const results = await Promise.race([
                    Promise.all(apiPromises),
                    timeoutPromise
                ]);

                const data = results.find(r => r !== null);
                if (!data) throw new Error('No valid API response');
                return data;
            } catch (error) {
                console.error('Fetch error:', error);
                throw error;
            }
        }

        async function processURL() {
            const url = DOM.urlInput.value.trim();

            if (!validateURL(url)) {
                showToast('Invalid TikTok URL', 'error');
                return;
            }

            if (STATE.isLoading) return;

            STATE.isLoading = true;
            DOM.processBtn.disabled = true;
            DOM.urlInput.disabled = true;

            try {
                showToast('Fetching video...', 'info');
                const videoData = await fetchFromAPIs(url);

                STATE.videoData = videoData;
                const videoId = videoData.id || 'tiktok';
                const extension = STATE.currentFormat === 'mp4' ? 'mp4' : 'mp3';
                STATE.currentFilename = `tiktok_${videoId}_${extension}`;
                DOM.filenameInput.value = '';

                showPreview(videoData);
                showToast('Video fetched successfully!', 'success');
            } catch (error) {
                let errorMessage = 'Something went wrong';
                if (error.message.includes('timeout')) {
                    errorMessage = 'Connection timeout. Please try again.';
                } else if (error.message.includes('No valid')) {
                    errorMessage = 'Video not found or already deleted';
                }
                showToast(errorMessage, 'error', 4000);
            } finally {
                STATE.isLoading = false;
                DOM.processBtn.disabled = false;
                DOM.urlInput.disabled = false;
            }
        }

        function showPreview(data) {
            const thumbnailUrl = data.cover || data.ai_dynamic_cover || data.origin_cover;
            if (thumbnailUrl) {
                DOM.previewThumbnail.src = thumbnailUrl;
            }

            const caption = truncateText(data.title || 'Untitled', 100);
            DOM.previewCaption.textContent = caption;

            const views = formatNumber(data.play_count || 0);
            const duration = formatDuration(data.duration || 0);
            const likes = formatNumber(data.digg_count || 0);
            DOM.previewMetadata.innerHTML = `
                <div class="metadata-item">
                    <i class="fas fa-heart"></i> ${likes}
                </div>
                <div class="metadata-item">
                    <i class="fas fa-clock"></i> ${duration}
                </div>
                <div class="metadata-item">
                    <i class="fas fa-eye"></i> ${views}
                </div>
            `;

            DOM.previewSection.classList.add('show');
            DOM.filenameSection.classList.add('show');
        }

        function updateDownloadButton() {
            const format = STATE.currentFormat.toUpperCase();
            DOM.downloadBtnText.textContent = `DOWNLOAD ${format}`;
        }

        function updateFilenameExtension() {
            const extension = STATE.currentFormat === 'mp4' ? '.mp4' : '.mp3';
            DOM.filenameExtension.textContent = extension;
        }

        function getDownloadURL() {
            if (!STATE.videoData) return null;
            if (STATE.currentFormat === 'mp4') {
                return STATE.videoData.play || STATE.videoData.hdplay;
            } else {
                return STATE.videoData.music?.play;
            }
        }

        function getFilenameWithExtension() {
            let filename = DOM.filenameInput.value.trim();
            if (!filename) filename = STATE.currentFilename;
            filename = sanitizeFilename(filename);
            const extension = STATE.currentFormat === 'mp4' ? 'mp4' : 'mp3';
            return `${filename}.${extension}`;
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function downloadVideo() {
            const downloadUrl = getDownloadURL();
            const filename = getFilenameWithExtension();

            if (!downloadUrl) {
                showToast('Download URL not found', 'error');
                return;
            }

            if (!validateFilename(DOM.filenameInput.value)) {
                showToast('Invalid filename', 'error');
                return;
            }

            STATE.isDownloading = true;

            DOM.downloadBtn.style.display = 'none';
            DOM.progressContainer.classList.add('show');

            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', downloadUrl, true);
                xhr.responseType = 'blob';

                xhr.onprogress = (event) => {
                    if (event.lengthComputable) {
                        const percent = Math.round((event.loaded / event.total) * 100);
                        DOM.progressBar.style.width = `${percent}%`;
                        DOM.progressPercentage.textContent = `${percent}%`;
                        DOM.progressText.textContent = 'Downloading...';
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        const blob = xhr.response;
                        triggerDownload(blob, filename);
                        showToast('✓ Download complete!', 'success');
                        resetDownloadUI();
                    } else {
                        showToast(`Download failed: ${xhr.status}`, 'error');
                        resetDownloadUI();
                    }
                };

                xhr.onerror = () => {
                    showToast('Network error during download', 'error');
                    resetDownloadUI();
                };

                xhr.onabort = () => {
                    showToast('Download cancelled', 'warning');
                    resetDownloadUI();
                };

                xhr.send();
                STATE.currentXHR = xhr;
            } catch (error) {
                console.error('Download error:', error);
                showToast('Download error', 'error');
                resetDownloadUI();
            }
        }

        function resetDownloadUI() {
            STATE.isDownloading = false;
            DOM.downloadBtn.style.display = 'flex';
            DOM.progressContainer.classList.remove('show');
            DOM.progressBar.style.width = '0%';
            DOM.progressPercentage.textContent = '0%';
            DOM.progressText.textContent = 'Downloading...';
        }

        function cancelDownload() {
            if (STATE.currentXHR) {
                STATE.currentXHR.abort();
            }
            resetDownloadUI();
        }

        // ===== INITIALIZATION =====
        function initializeLoadingScreen() {
            setTimeout(() => {
                DOM.loadingScreen.classList.add('hidden');
                setTimeout(() => {
                    DOM.appContainer.classList.add('visible');
                    DOM.urlInput.focus();
                }, 200);
            }, CONFIG.LOADING_DURATION);
        }

        function setupEventListeners() {
            DOM.urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !STATE.isLoading) {
                    processURL();
                }
            });

            DOM.urlInput.addEventListener('input', debounce(() => {
                validateURL(DOM.urlInput.value);
            }, CONFIG.INPUT_DEBOUNCE));

            DOM.processBtn.addEventListener('click', processURL);

            DOM.formatBtns.forEach((btn) => {
                btn.addEventListener('click', (e) => {
                    DOM.formatBtns.forEach(b => b.classList.remove('active'));
                    e.target.closest('.format-btn').classList.add('active');
                    STATE.currentFormat = e.target.closest('.format-btn').dataset.format;
                    updateDownloadButton();
                    updateFilenameExtension();
                });
            });

            DOM.filenameInput.addEventListener('input', (e) => {
                const sanitized = sanitizeFilename(e.target.value);
                e.target.value = sanitized;
                validateFilename(sanitized);
            });

            DOM.downloadBtn.addEventListener('click', downloadVideo);
            DOM.progressCancel.addEventListener('click', cancelDownload);
        }

        function init() {
            initializeLoadingScreen();
            setupEventListeners();
            updateDownloadButton();
        }

        init();
    </script>
</body>
  </html>
